            - paragraph [ref=f14e480]: "Chrissy's story: Nursing to cyber security and a 3x salary increase"
            - generic [ref=f14e481]:
              - paragraph [ref=f14e482]: I didn't start in cyber security - I was a nurse, but realised I wanted a change. I decided to explore Cyber and began using TryHackMe. I planned to try it for a few hours but ended up spending over 12 hours on the first day, I was hooked. After around a year of consistent, hands-on learning, I successfully transitioned into a Cyber Security Support Specialist role. I truly credit TryHackMe for giving me both the skills and confidence to make that leap. The practical labs and structured paths kept me motivated. Being able to apply what I learned, especially topics like Active Directory and SOC fundamentals - helped me in interviews and in my day-to-day job.
