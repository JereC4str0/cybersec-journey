        - paragraph [ref=f28e180]: The HTB Certified Wi-Fi Pentesting Expert (HTB CWPE) is designed for professionals seeking to master real-world Wi-Fi exploitation. Through a rigorous, hands-on assessment, candidates demonstrate their ability to attack and compromise wireless networks across all major protocols, including WPA3 and WPA-Enterprise. HTB CWPE certified experts are skilled in deploying rogue access points, harvesting credentials, bypassing captive portals, exploiting routers and leveraging advanced tools to penetrate even hardened enterprise wireless environments. Using industry standard tools such as Airgeddon, Eaphammer, Kismet, Wifipumpkin3, Bettercap, and Aircrack-ng, candidates learn to exploit vulnerabilities across WEP, WPA, WPA2, WPA3, and WPA-Enterprise networks. Beyond wireless compromise, CWPE professionals are also capable of pivoting into internal networks and gaining an initial Active Directory foothold by exploiting weaknesses in enterprise Wi-Fi networks.
